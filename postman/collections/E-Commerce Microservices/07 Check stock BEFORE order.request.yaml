$kind: http-request
url: "{{baseUrl}}/inventory/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Stock before - status 200", function () { pm.response.to.have.status(200); });
      var j = pm.response.json();
      pm.test("10 available, 0 reserved", function () { pm.expect(j.availableQuantity).to.eql(10); pm.expect(j.reservedQuantity).to.eql(0); });
    language: text/javascript
order: 7000
