$kind: http-request
url: "{{baseUrl}}/users"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "Anita",
      "email": "{{email}}",
      "password": "Pass@123"
    }
scripts:
  - type: beforeRequest
    code: pm.collectionVariables.set("email", "user" + Date.now() + "@example.com");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Register - status 201", function () { pm.response.to.have.status(201); });
      var j = pm.response.json();
      pm.collectionVariables.set("userId", j.id);
    language: text/javascript
order: 2000
