$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{email}}",
      "password": "Pass@123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Login - status 200", function () { pm.response.to.have.status(200); });
      var j = pm.response.json();
      pm.collectionVariables.set("token", j.token);
    language: text/javascript
order: 3000
