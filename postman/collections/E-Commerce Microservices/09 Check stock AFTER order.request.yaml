$kind: http-request
url: "{{baseUrl}}/inventory/{{productId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Stock after - status 200", function () { pm.response.to.have.status(200); });
      var j = pm.response.json();
      pm.test("8 available, 2 reserved", function () { pm.expect(j.availableQuantity).to.eql(8); pm.expect(j.reservedQuantity).to.eql(2); });
    language: text/javascript
order: 9000
