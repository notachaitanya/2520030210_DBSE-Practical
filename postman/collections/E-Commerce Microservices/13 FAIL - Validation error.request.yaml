$kind: http-request
url: "{{baseUrl}}/products"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "A",
      "category": "Test",
      "price": -10
    }
scripts:
  - type: afterResponse
    code: pm.test("Validation - status 422", function () { pm.response.to.have.status(422); });
    language: text/javascript
order: 13000
