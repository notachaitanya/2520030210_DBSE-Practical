$kind: http-request
url: "{{baseUrl}}/orders"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "userId": "{{userId}}",
      "items": [
        {
          "productId": "{{productId}}",
          "quantity": 1
        }
      ]
    }
scripts:
  - type: afterResponse
    code: pm.test("Order fails when Inventory is down - status 409", function () { pm.response.to.have.status(409); });
    language: text/javascript
order: 18000
